<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KD Panel</title>
<link rel="stylesheet" href="panel.css">
<style>
  :root { --bg: #0b0c10; --text: #e6e8ee; --muted: #8a90a0; --panel: #171a21; --border: #2c313d; --err: #ff5c5c; --ok: #3ecf8e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 16px/1.3 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; user-select: none; touch-action: manipulation; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header #mode { display: flex; flex-wrap: wrap; gap: 6px; }
  header #mode[hidden] { display: none; }
  header .mode { font-size: 13px; padding: 3px 10px; border-radius: 12px; background: var(--panel); color: var(--muted); }
  header .mode.mcol { background: var(--mc); color: #fff; text-shadow: 0 1px 2px #0008; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); }
  header .dot.ok { background: var(--ok); }
  main { flex: 1; overflow: auto; padding: 16px; }
  /* The panel's shared part (logo, clock, Home button): a band above or below every page. */
  .shared { padding: 16px 16px 0; }
  .shared.bot { padding: 0 16px 16px; }
  .shared[hidden] { display: none; }
  /* A shared part as a column: the page scrolls next to it. A band/column with its own
     background gets the same padding all round, so its controls don't touch its edge. */
  #mid { flex: 1; display: flex; min-height: 0; }
  #mid > main { min-width: 0; }
  .shared.side { flex: 0 0 auto; overflow: auto; padding: 16px 0 16px 16px; }
  .shared.side.right { padding: 16px 16px 16px 0; }
  .shared.own { padding: 16px; }
  /* The panel theme (--p-*, set on body by render) wins over these defaults. */
  body { background: var(--p-bg, var(--bg)); color: var(--p-text, var(--text)); }
  header { border-color: var(--p-border, var(--border)); }
  .overlay { position: fixed; inset: 0; background: #000c; display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; width: min(420px, 100%); text-align: center; }
  .dialog p { font-size: 20px; margin: 0 0 20px; }
  .dialog .row { display: flex; gap: 12px; }
  .dialog .row .pbtn { flex: 1; }
  .pin { font-size: 32px; letter-spacing: 12px; min-height: 44px; margin-bottom: 14px; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .keys .pbtn { min-height: 64px; background: #2a3140; font-size: 24px; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .empty { color: var(--muted); text-align: center; margin-top: 20vh; }
  /* "Go black after": over everything, fades in; the touch that wakes it does nothing else */
  #black { position: fixed; inset: 0; z-index: 1000; background: #000; cursor: none; opacity: 0; pointer-events: none; transition: opacity .4s; }
  #black.on { opacity: 1; pointer-events: auto; transition-duration: 1.5s; }
  #black.waking { pointer-events: auto; }
</style>
</head>
<body>
<header><h1 id="title">KD Panel</h1><span id="mode" hidden></span><span class="dot" id="conn" title="connection"></span></header>
<section id="sharedTop" class="shared" hidden></section>
<div id="mid"><section id="sharedLeft" class="shared side" hidden></section><main id="main"><p class="empty">Loading…</p></main><section id="sharedRight" class="shared side right" hidden></section></div>
<section id="sharedBot" class="shared bot" hidden></section>
<div id="black"></div>
<script src="panel-ui.js"></script>
<script>
'use strict';
// Touch panel: pages and controls defined in the project ("panel" section); the controls
// themselves (markup, live state, dragging) are in panel-ui.js.
// unlocked = the PINs typed since the last lock: every page with one of them opens without
// asking again (a service page with its own PIN still asks).
let project = null, status = null, pageId = null, unlocked = new Set(), lastStatusAt = 0, projectVersion = null;
// The page a go-to button came from: "Back" on a PIN screen returns there.
let cameFrom = null;
const $ = (s) => document.querySelector(s);
const esc = pEsc;
panelPresetSource = () => project;
// Which panel this is: ?p=<id or name>, else the first.
const wanted = (new URLSearchParams(location.search).get('p') || '').toLowerCase();
const panelNow = () => { const l = panelList(project); return l.find((x) => String(x.id) === wanted || (x.name || '').toLowerCase() === wanted) || l[0]; };
const pages = () => (project ? panelPagesOf(project, panelNow().id) : []);
const page = () => pages().find((p) => p.id === pageId) || pages()[0];
const isOpen = (pg) => !pg.pin || unlocked.has(String(pg.pin));
const showing = () => page() && isOpen(page());
const startId = () => panelNow().start ?? pages()[0]?.id;
const shared = () => (project ? panelSharedOf(project, panelNow().id) : null);
// Where the shared part shows now (null: none, or this page leaves it out).
const SHARED_EL = { '': '#sharedTop', bottom: '#sharedBot', left: '#sharedLeft', right: '#sharedRight' };
const sharedEls = () => Object.values(SHARED_EL).map((s) => $(s));
const sharedRoot = () => { const sh = shared(), pg = page(); return sh && pg && !pg.noShared ? $(SHARED_EL[sh.sharedAt || ''] || SHARED_EL['']) : null; };
// Live state into everything shown: the page and the shared part.
function updateAll() {
  if (showing()) panelUpdate($('#main'), page(), status);
  const r = sharedRoot();
  if (r) panelUpdate(r, shared(), status);
}

// Events go out one at a time, in order. A change still waiting is replaced by a newer one
// of the same control, so a slow network never queues up old slider positions.
const queue = [];
let sending = false;
function send(c, event, value) {
  const last = queue[queue.length - 1];
  if (event === 'change' && last?.event === 'change' && last.c === c) { last.value = value; return; }
  queue.push({ c, event, value });
  if (!sending) pump();
}
async function pump() {
  sending = true;
  while (queue.length) {
    const { c, event, value } = queue.shift();
    const q = new URLSearchParams({ control: c.name || '', event });
    if (value != null) {
      q.set('value', value);
      const links = panelLinkValues(c, value, panelLocal[String(c.name || '').toLowerCase()]?.hsv);
      if (links.length) q.set('vars', links.map(([n, v]) => `${n}=${v}`).join(';'));
    }
    try { await fetch(`/api/panel?${q}`, { method: 'POST' }); } catch { /* offline: the dot shows it */ }
  }
  sending = false;
}

// The page this browser showed last, per panel, so a refresh (or the tablet's browser restarting)
// comes back on it. Per browser: two tablets on the same panel each keep their own. A PIN page
// still asks for its PIN after a refresh (unlocked is not kept).
const lastKey = () => `kd.panelPage.${panelNow().id}`;
function rememberPage(id) { try { localStorage.setItem(lastKey(), String(id)); } catch { /* private mode */ } }
function rememberedPage() {
  let v = null;
  try { v = localStorage.getItem(lastKey()); } catch { /* private mode */ }
  return pages().find((p) => String(p.id) === v)?.id ?? startId();
}

function render() {
  const pg = page();
  if (pg) rememberPage(pg.id);
  document.body.style.cssText = panelThemeVars(project?.panel?.theme) + panelPageBg(pg);
  // The shared part: also above a PIN question (it is on every page anyway).
  const sr = sharedRoot();
  const sh = shared();
  for (const el of sharedEls()) {
    const on = el === sr, bg = on && /^#[0-9a-f]{6}$/i.test(sh.bg || '') ? sh.bg : '';
    el.hidden = !on;
    el.classList.toggle('own', !!bg);
    el.style.background = bg;
    el.style.width = on && panelSharedSide(sh) ? panelSharedWidth(sh) + 'px' : '';
    el.innerHTML = on ? panelPageHtml(sh, status, false, project.panel.theme) : '';
  }
  if (sr) panelUpdate(sr, shared(), status);
  if (!pg) { $('#main').innerHTML = '<p class="empty">No panel pages yet - add them on the Panel page of KD Designer.</p>'; return; }
  if (!isOpen(pg)) return askPin(pg);
  $('#main').innerHTML = panelPageHtml(pg, status, false, project.panel.theme);
  panelUpdate($('#main'), pg, status);
  tickClock();
}

function confirmDialog(question) {
  return new Promise((resolve) => {
    const o = document.createElement('div');
    o.className = 'overlay';
    o.innerHTML = `<div class="dialog"><p>${esc(question)}</p><div class="row">
      <button class="pbtn" style="background:#3a7d44" data-a="1">Ja</button><button class="pbtn" style="background:#8a2b2b" data-a="0">Nee</button></div></div>`;
    o.addEventListener('click', (e) => {
      const b = e.target.closest('[data-a]');
      if (!b) return;
      o.remove();
      resolve(b.dataset.a === '1');
    });
    document.body.appendChild(o);
  });
}

function askPin(pg) {
  let entered = '';
  $('#main').innerHTML = `<div class="overlay" style="position:static;background:none;min-height:70vh"><div class="dialog" id="pinbox">
    <p>${esc(pg.name)}</p><div class="pin" id="pin">&nbsp;</div>
    <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, 'OK'].map((k) => `<button class="pbtn" data-k="${k}">${k}</button>`).join('')}</div>
    ${pages().length > 1 && pg.id !== startId() ? '<div class="row" style="margin-top:12px"><button class="pbtn" data-k="back" style="background:#333">Terug</button></div>' : ''}
  </div></div>`;
  $('#pinbox').addEventListener('click', (e) => {
    const k = e.target.closest('[data-k]')?.dataset.k;
    if (k == null) return;
    if (k === 'back') { pageId = pages().some((p) => p.id === cameFrom) && cameFrom !== pg.id ? cameFrom : startId(); render(); return; }
    if (k === '⌫') entered = entered.slice(0, -1);
    else if (k === 'OK') {
      if (entered === String(pg.pin)) { unlocked.add(entered); render(); return; }
      entered = '';
      $('#pinbox').classList.remove('shake');
      void $('#pinbox').offsetWidth;
      $('#pinbox').classList.add('shake');
    } else if (entered.length < 8) entered += k;
    $('#pin').textContent = '•'.repeat(entered.length) || ' ';
  });
}

// press / release fire immediately; click fires on release over the button,
// after the confirm question (if any) is answered "Ja". A toggle then flips and sends "change".
// The same on the page (#main) and the shared part: getPg gives the controls of each.
function wire(root, getPg) {
root.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.pbtn[data-i]');
  if (!b || b.classList.contains('p-dis') || b.classList.contains('p-lock')) return;
  const c = getPg()?.controls[+b.dataset.i];
  if (!c) return;
  b.classList.add('down');
  b.setPointerCapture(e.pointerId);
  send(c, 'press');
  const up = async (ev) => {
    b.classList.remove('down');
    send(c, 'release');
    const r = b.getBoundingClientRect();
    const inside = ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
    if (ev.type !== 'pointerup' || !inside) return;
    if (c.confirm && !(await confirmDialog(c.confirm))) return;
    send(c, 'click');
    if (c.type === 'toggle') {
      const v = +panelCtlState(c, status).value > 0 ? 0 : 1;
      panelLocal[String(c.name || '').toLowerCase()] = { value: v, until: Date.now() + 1500 };
      updateAll();
      send(c, 'change', v);
    }
    if (c.goto && c.goto !== page()?.id) {
      // Going back to the start page "logs out" of the PIN pages, so the next visitor needs
      // the PIN again. Moving between pages with the same PIN (Technician -> Groups -> back)
      // keeps them unlocked.
      if (c.goto === startId()) unlocked.clear();
      cameFrom = page().id;
      pageId = c.goto;
      render();
    }
  };
  b.addEventListener('pointerup', up, { once: true });
  b.addEventListener('pointercancel', up, { once: true });
});
panelDrag(root, getPg, () => status, send);
// Radio group: touching a choice lights it and sends "change" with its text (again too, when it is lit already).
root.addEventListener('click', (e) => {
  const o = e.target.closest('.popt[data-o]'), el = o?.closest('.pradio[data-i]');
  const c = el && getPg()?.controls[+el.dataset.i];
  if (!c || el.classList.contains('p-dis') || el.classList.contains('p-lock')) return;
  panelLocal[String(c.name || '').toLowerCase()] = { value: o.dataset.o, until: Date.now() + 1500 };
  updateAll();
  send(c, 'change', o.dataset.o);
});
}
wire($('#main'), () => (showing() ? page() : null));
for (const el of sharedEls()) wire(el, () => (sharedRoot() === el ? shared() : null));

// "Go black after" (this panel's setting, seconds; none = never): nobody touched the panel for
// that long -> a black screen. The first touch only brings the panel back: the black stays in
// front until that touch is over, so it can't press the button under it.
let lastTouch = Date.now(), wakeTimer = 0;
const blackEl = $('#black');
function touched() {
  lastTouch = Date.now();
  if (!blackEl.classList.contains('on')) return;
  blackEl.classList.remove('on');
  blackEl.classList.add('waking');
  clearTimeout(wakeTimer);
  wakeTimer = setTimeout(() => blackEl.classList.remove('waking'), 500);
}
for (const ev of ['pointerdown', 'pointermove', 'keydown', 'wheel']) window.addEventListener(ev, touched, { capture: true, passive: true });
setInterval(() => {
  const s = project ? +panelNow().sleep || 0 : 0;
  if (!(s > 0 && Date.now() - lastTouch > s * 1000) || blackEl.classList.contains('on')) return;
  blackEl.classList.add('on');
  // Going black also locks the PIN pages: whoever wakes the panel on one types the PIN again.
  if (unlocked.size) { unlocked.clear(); if (page()?.pin) render(); }
}, 500);

function tickClock() {
  const t = panelTime();
  document.querySelectorAll('[data-clock]').forEach((el) => (el.textContent = t));
}
setInterval(tickClock, 1000);
// Controls that follow a timeline move between statuses too.
setInterval(() => { if (status && [page(), shared()].some((x) => x?.controls.some((c) => c.follow))) updateAll(); }, 200);
setInterval(() => $('#conn').classList.toggle('ok', Date.now() - lastStatusAt < 4000), 1000);

// The project was saved/reloaded on the controller: fetch the new pages, PINs and
// buttons. A typed PIN stays unlocked only while some page still has it.
async function reloadProject() {
  try {
    const fresh = await (await fetch('/api/project')).json();
    project = fresh;
    const used = new Set(pages().map((p) => String(p.pin || '')));
    for (const pin of [...unlocked]) if (!used.has(pin)) unlocked.delete(pin);
    if (!pages().some((p) => p.id === pageId)) pageId = startId();
    document.title = $('#title').textContent = panelNow().title || project.name || 'KD Panel';
    render();
  } catch { projectVersion = -1; /* mismatch: retried on the next status */ }
}

// "panel <panel|all> page <page|start>" actions (status panelGo: {page, n} per panel name or "all"):
// the newest one for this panel switches pages. The first status only notes where they stand, so
// opening or reloading the panel doesn't jump to a page an older action asked for.
let goSeen = null;
function followGo() {
  const me = panelNow(), names = new Set([String(me.id), (me.name || '').toLowerCase(), 'all']);
  let best = null;
  for (const [k, v] of Object.entries(status.panelGo || {})) if (names.has(k.toLowerCase()) && (!best || v.n > best.n)) best = v;
  if (goSeen === null || !best || best.n <= goSeen) { goSeen = Math.max(goSeen ?? 0, best?.n ?? 0); return; }
  goSeen = best.n;
  const want = String(best.page || '').toLowerCase();
  const to = want === 'start' ? pages().find((p) => p.id === startId()) : pages().find((p) => String(p.id) === want || (p.name || '').toLowerCase() === want);
  if (!to) return;
  // The start page locks the PIN pages again, like a go-to button. But the controller sent it
  // there (a trigger), so the page itself opens without its PIN (also when already showing it);
  // other pages with the same PIN open too, until the panel goes black or back to the start.
  if (to.id === startId()) unlocked.clear();
  const pin = to.pin ? String(to.pin) : '', wasOpen = !pin || unlocked.has(pin);
  if (pin) unlocked.add(pin);
  if (to.id === page()?.id && wasOpen) return;
  if (to.id !== page()?.id) { cameFrom = page()?.id; pageId = to.id; }
  render();
}

function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('status', (e) => {
    status = JSON.parse(e.data);
    lastStatusAt = status._at = Date.now();   // _at: controls that follow a timeline move on from here
    if (status.projectVersion != null && status.projectVersion !== projectVersion) {
      const first = projectVersion === null;
      projectVersion = status.projectVersion;
      if (!first) { reloadProject(); return; }
    }
    followGo();
    // One pill per mode group ("Curtains: Open"), in the state's colour and icon (Modes page).
    const want = new Set((panelNow().modes || []).map((m) => String(m).toLowerCase()));
    const modes = Object.entries(status.modes || {}).filter(([g, v]) => v && want.has(g.toLowerCase()));
    $('#mode').hidden = !modes.length;
    $('#mode').innerHTML = modes.map(([g, v]) => {
      const info = (project.modes || []).find((x) => x?.name === g)?.stateInfo?.[v] || {};
      return `<span class="mode${info.color ? ' mcol' : ''}"${info.color ? ` style="--mc:${esc(info.color)}"` : ''}>${info.icon ? esc(info.icon) + ' ' : ''}${esc(modes.length > 1 ? `${g}: ${v}` : v)}</span>`;
    }).join('');
    // Patched in place, so a slider being dragged or an open confirm question stays.
    updateAll();
  });
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}

(async () => {
  try {
    project = await (await fetch('/api/project')).json();
    document.title = $('#title').textContent = panelNow().title || project.name || 'KD Panel';
    pageId = rememberedPage();
  } catch {
    $('#main').innerHTML = '<p class="empty">Cannot load the project.</p>';
    return;
  }
  render();
  connect();
})();
</script>
</body>
</html>
