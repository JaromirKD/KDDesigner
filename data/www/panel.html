<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KD Panel</title>
<link rel="stylesheet" href="panel.css">
<style>
  :root { --bg: #0b0c10; --text: #e6e8ee; --muted: #8a90a0; --panel: #171a21; --border: #2c313d; --err: #ff5c5c; --ok: #3ecf8e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 16px/1.3 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; user-select: none; touch-action: manipulation; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header .mode { font-size: 13px; padding: 3px 10px; border-radius: 12px; background: var(--panel); color: var(--muted); }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); }
  header .dot.ok { background: var(--ok); }
  main { flex: 1; overflow: auto; padding: 16px; }
  /* The panel theme (--p-*, set on body by render) wins over these defaults. */
  body { background: var(--p-bg, var(--bg)); color: var(--p-text, var(--text)); }
  header { border-color: var(--p-border, var(--border)); }
  .overlay { position: fixed; inset: 0; background: #000c; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; width: min(420px, 100%); text-align: center; }
  .dialog p { font-size: 20px; margin: 0 0 20px; }
  .dialog .row { display: flex; gap: 12px; }
  .dialog .row .pbtn { flex: 1; }
  .pin { font-size: 32px; letter-spacing: 12px; min-height: 44px; margin-bottom: 14px; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .keys .pbtn { min-height: 64px; background: #2a3140; font-size: 24px; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .empty { color: var(--muted); text-align: center; margin-top: 20vh; }
</style>
</head>
<body>
<header><h1 id="title">KD Panel</h1><span class="mode" id="mode" hidden></span><span class="dot" id="conn" title="connection"></span></header>
<main id="main"><p class="empty">Loading…</p></main>
<script src="panel-ui.js"></script>
<script>
'use strict';
// Touch panel: pages and controls defined in the project ("panel" section); the controls
// themselves (markup, live state, dragging) are in panel-ui.js.
let project = null, status = null, pageId = null, unlocked = new Set(), lastStatusAt = 0, projectVersion = null;
const $ = (s) => document.querySelector(s);
const esc = pEsc;
const pages = () => project?.panel?.pages || [];
const page = () => pages().find((p) => p.id === pageId) || pages()[0];
const showing = () => page() && (!page().pin || unlocked.has(page().id));

// Events go out one at a time, in order. A change still waiting is replaced by a newer one
// of the same control, so a slow network never queues up old slider positions.
const queue = [];
let sending = false;
function send(c, event, value) {
  const last = queue[queue.length - 1];
  if (event === 'change' && last?.event === 'change' && last.c === c) { last.value = value; return; }
  queue.push({ c, event, value });
  if (!sending) pump();
}
async function pump() {
  sending = true;
  while (queue.length) {
    const { c, event, value } = queue.shift();
    const q = new URLSearchParams({ control: c.name || '', event });
    if (value != null) {
      q.set('value', value);
      const links = panelLinkValues(c, value, panelLocal[String(c.name || '').toLowerCase()]?.hsv);
      if (links.length) q.set('vars', links.map(([n, v]) => `${n}=${v}`).join(';'));
    }
    try { await fetch(`/api/panel?${q}`, { method: 'POST' }); } catch { /* offline: the dot shows it */ }
  }
  sending = false;
}

function render() {
  const pg = page();
  document.body.style.cssText = panelThemeVars(project?.panel?.theme);
  if (!pg) { $('#main').innerHTML = '<p class="empty">No panel pages yet - add them on the Panel page of KD Designer.</p>'; return; }
  if (pg.pin && !unlocked.has(pg.id)) return askPin(pg);
  $('#main').innerHTML = panelPageHtml(pg, status, false, project.panel.theme);
  panelUpdate($('#main'), pg, status);
  tickClock();
}

function confirmDialog(question) {
  return new Promise((resolve) => {
    const o = document.createElement('div');
    o.className = 'overlay';
    o.innerHTML = `<div class="dialog"><p>${esc(question)}</p><div class="row">
      <button class="pbtn" style="background:#3a7d44" data-a="1">Ja</button><button class="pbtn" style="background:#8a2b2b" data-a="0">Nee</button></div></div>`;
    o.addEventListener('click', (e) => {
      const b = e.target.closest('[data-a]');
      if (!b) return;
      o.remove();
      resolve(b.dataset.a === '1');
    });
    document.body.appendChild(o);
  });
}

function askPin(pg) {
  let entered = '';
  $('#main').innerHTML = `<div class="overlay" style="position:static;background:none;min-height:70vh"><div class="dialog" id="pinbox">
    <p>${esc(pg.name)}</p><div class="pin" id="pin">&nbsp;</div>
    <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, 'OK'].map((k) => `<button class="pbtn" data-k="${k}">${k}</button>`).join('')}</div>
    ${pages().length > 1 && pg.id !== project.panel.start ? '<div class="row" style="margin-top:12px"><button class="pbtn" data-k="back" style="background:#333">Terug</button></div>' : ''}
  </div></div>`;
  $('#pinbox').addEventListener('click', (e) => {
    const k = e.target.closest('[data-k]')?.dataset.k;
    if (k == null) return;
    if (k === 'back') { pageId = project.panel.start; render(); return; }
    if (k === '⌫') entered = entered.slice(0, -1);
    else if (k === 'OK') {
      if (entered === String(pg.pin)) { unlocked.add(pg.id); render(); return; }
      entered = '';
      $('#pinbox').classList.remove('shake');
      void $('#pinbox').offsetWidth;
      $('#pinbox').classList.add('shake');
    } else if (entered.length < 8) entered += k;
    $('#pin').textContent = '•'.repeat(entered.length) || ' ';
  });
}

// press / release fire immediately; click fires on release over the button,
// after the confirm question (if any) is answered "Ja". A toggle then flips and sends "change".
$('#main').addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.pbtn[data-i]');
  if (!b || b.classList.contains('p-dis')) return;
  const c = page().controls[+b.dataset.i];
  b.classList.add('down');
  b.setPointerCapture(e.pointerId);
  send(c, 'press');
  const up = async (ev) => {
    b.classList.remove('down');
    send(c, 'release');
    const r = b.getBoundingClientRect();
    const inside = ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
    if (ev.type !== 'pointerup' || !inside) return;
    if (c.confirm && !(await confirmDialog(c.confirm))) return;
    send(c, 'click');
    if (c.type === 'toggle') {
      const v = +panelCtlState(c, status).value > 0 ? 0 : 1;
      panelLocal[String(c.name || '').toLowerCase()] = { value: v, until: Date.now() + 1500 };
      panelUpdate($('#main'), page(), status);
      send(c, 'change', v);
    }
    if (c.goto) {
      // Leaving a PIN page "logs out" of it.
      unlocked.delete(page().id);
      pageId = c.goto;
      render();
    }
  };
  b.addEventListener('pointerup', up, { once: true });
  b.addEventListener('pointercancel', up, { once: true });
});
panelDrag($('#main'), () => (showing() ? page() : null), () => status, send);

function tickClock() {
  const t = panelTime();
  document.querySelectorAll('[data-clock]').forEach((el) => (el.textContent = t));
}
setInterval(tickClock, 1000);
setInterval(() => $('#conn').classList.toggle('ok', Date.now() - lastStatusAt < 4000), 1000);

// The project was saved/reloaded on the controller: fetch the new pages, PINs and
// buttons. A page stays unlocked only if it still exists with the same PIN.
async function reloadProject() {
  try {
    const fresh = await (await fetch('/api/project')).json();
    const oldPins = new Map(pages().map((p) => [p.id, String(p.pin || '')]));
    project = fresh;
    for (const id of [...unlocked]) {
      const p = pages().find((x) => x.id === id);
      if (!p || String(p.pin || '') !== oldPins.get(id)) unlocked.delete(id);
    }
    if (!pages().some((p) => p.id === pageId)) pageId = project.panel?.start ?? pages()[0]?.id;
    document.title = $('#title').textContent = project.panel?.title || project.name || 'KD Panel';
    render();
  } catch { projectVersion = -1; /* mismatch: retried on the next status */ }
}

function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('status', (e) => {
    status = JSON.parse(e.data);
    lastStatusAt = Date.now();
    if (status.projectVersion != null && status.projectVersion !== projectVersion) {
      const first = projectVersion === null;
      projectVersion = status.projectVersion;
      if (!first) { reloadProject(); return; }
    }
    // One pill per mode group: "Curtains: Open · Museum: Closed"
    const modes = Object.entries(status.modes || {}).filter(([, v]) => v);
    $('#mode').hidden = !modes.length;
    $('#mode').textContent = modes.map(([g, v]) => (modes.length > 1 ? `${g}: ${v}` : v)).join(' · ');
    // Patched in place, so a slider being dragged or an open confirm question stays.
    if (showing()) panelUpdate($('#main'), page(), status);
  });
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}

(async () => {
  try {
    project = await (await fetch('/api/project')).json();
    document.title = $('#title').textContent = project.panel?.title || project.name || 'KD Panel';
    pageId = project.panel?.start ?? pages()[0]?.id;
  } catch {
    $('#main').innerHTML = '<p class="empty">Cannot load the project.</p>';
    return;
  }
  render();
  connect();
})();
</script>
</body>
</html>
