; KD Designer - show controller firmware for Arduino Portenta H7 (M7 core)
[platformio]
default_envs = portenta_h7_m7

; Portenta H7 on a Breakout / Mid Carrier: 2 DMX ports, no board I/O.
[env:portenta_h7_m7]
platform = ststm32
board = portenta_h7_m7
framework = arduino
monitor_speed = 115200
; Our own copy of the Portenta variant: its libmbed.a is rebuilt with more network sockets
; (Arduino's allows only 4 in total). See tools/core/README.md.
board_build.variants_dir = tools/core/variants
; PlatformIO's STM32 builder adds -mfloat-abi=soft for Mbed boards, after the core's own
; -mfloat-abi=softfp: all float and double maths ran in software (effects ~77 us per fixture).
; The core library is built softfp (as the Arduino IDE builds), so the hardware FPU is used.
; It also links newlib-nano, whose malloc walks one list of all free blocks: on our heap
; (thousands of small Strings) one allocation took ~20 000 cycles (50 us), and a UDP message
; matched against 100 triggers ~1.7 ms. Full newlib's malloc keeps free blocks in size bins.
build_unflags = -mfloat-abi=soft --specs=nano.specs
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    facchinm/Arduino_USBHostMbed5@^0.3.1
build_flags =
    -DKD_VERSION=\"0.1.1\"
; Arduino's UDP class cuts every packet at 508 bytes: a full Art-Net (530) or sACN (638)
; universe needs more. Costs ~2 KB of heap per UDP socket.
    -DWIFI_UDP_BUFFER_SIZE=1024
; ArduinoJson on 32-bit numbers its slots (about one per value or key) with 16 bits: max 65535
; per document, so a show with a few full-rig scenes (a 4096-channel scene is ~28k) was refused
; with "NoMemory" while the SDRAM was nearly empty. 32-bit ids lift that; slots get bigger, so
; pools stay at 64 slots (1 KB, as before) for the small documents on the heap.
    -DARDUINOJSON_SLOT_ID_SIZE=4
    -DARDUINOJSON_POOL_CAPACITY=64
; Writes updates/KD-Designer-<version>-<board>.kdupdate after each build (network update).
; Raise KD_VERSION for every update you hand out, so the controller can show what it runs.
extra_scripts = post:tools/make_update.py

; Portenta H7 in a Portenta Machine Control: 1 DMX port (its RS485), and its
; 24 V inputs / outputs / programmable I/O and 0-10 V analog I/O (src/Board.*).
; Build with: python -m platformio run -e machine_control
[env:machine_control]
extends = env:portenta_h7_m7
lib_deps =
    ${env:portenta_h7_m7.lib_deps}
    arduino-libraries/Arduino_PortentaMachineControl@^1.0.5
build_flags =
    ${env:portenta_h7_m7.build_flags}
    -DKD_BOARD_PMC
